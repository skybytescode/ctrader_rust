[package]
name = "ctrader_rust"
version = "0.1.0"
edition = "2024"
default-run = "ctrader_rust"

[[bin]]
name = "ctrader_rust"
path = "src/main.rs"

[[bin]]
name = "load_historical_data"
path = "src/bin/load_historical_data.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.24"
prost = "0.12"
prost-build = "0.12"
bytes = "1.5"
webpki-roots = "0.25"
dotenv = "0.15"
rss = "2.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
chrono = "0.4"
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Bevy game engine with egui integration
bevy = "0.15"
bevy_egui = "0.31"
# Database for historical candlestick data
duckdb = { version = "1.0", features = ["bundled"] }
csv = "1.3"

