name: CI

on:
  push:
    branches: [master, web_gold_strategies]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check and build
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: dtolnay/rust-toolchain@stable
      # The bundled DuckDB is a large C++ build; cache it between runs.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked --bin ctrader_rust
